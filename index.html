<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <title>practice</title>
</head>

<body>
  <div class="container">
    <div class="row">
      <h1 class="text-center h1">Users</h1>
    </div>
    <div class="row" id="table_row">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Start Date</th>
            <th scope="col">Sign Ups</th>
            <th scope="col">Optional One</th>
            <th scope="col">Delete Data</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
        </tbody>
      </table>
    </div>
    <div class="row">
      <div class="col-12 col-lg-8 mx-auto" id="form_row">
        <h2 class="text-center h3 mb-3">Add User</h2>
        <form id="user-form" class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="col-md-6">
            <label for="start-date" class="form-label">Start Date</label>
            <input type="date" class="form-control" id="start-date" name="startDate" required>
          </div>
          <div class="col-md-6">
            <label for="sign-ups" class="form-label">Sign Ups</label>
            <input type="number" class="form-control" id="sign-ups" name="signUps" min="0" required>
          </div>
          <div class="col-md-6">
            <label for="optional-one" class="form-label">Optional One</label>
            <input type="text" class="form-control" id="optional-one" name="optionalOne">
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary">Upload User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
